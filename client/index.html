<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      let preferredTheme;
      try {
        preferredTheme = localStorage.getItem("compute-tracker-theme");
      } catch {}
      document.documentElement.classList.toggle(
        "dark",
        preferredTheme
          ? preferredTheme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches
      );
    </script>
    <meta
      name="description"
      content="Compute Intelligence: compare GPU, CPU, TPU, and sandbox prices, reported availability, and recorded price history."
    />
    <title>Compute Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="apple-touch-icon" href="/brand/product-hunt-icon.png" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Compute Intelligence — Find the compute that fits."
    />
    <meta
      property="og:description"
      content="Compare GPU, CPU, TPU and sandbox prices. Explore recorded trends and estimate workload costs. Free and open source."
    />
    <meta
      property="og:url"
      content="https://darkstarstrix.github.io/gpu-price-tracker/"
    />
    <meta
      property="og:image"
      content="https://darkstarstrix.github.io/gpu-price-tracker/brand/launch-cover.png"
    />
    <meta
      property="og:image:alt"
      content="Compute Intelligence: Find the compute that fits. GPU, CPU, TPU and sandbox price comparisons."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-latin-v17.woff2"
      media="(min-width: 768px)"
      crossorigin
      fetchpriority="low"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
